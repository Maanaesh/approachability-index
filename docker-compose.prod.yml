# Production on a single VM: app + Caddy (automatic HTTPS) + optional local Postgres.
#   .env             → DOMAIN, POSTGRES_PASSWORD (compose interpolation only)
#   .env.production  → app config and secrets
# With local Postgres:  docker compose -f docker-compose.prod.yml --profile localdb up -d --build
# With Neon/external:   docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    profiles: [localdb]
    restart: unless-stopped
    environment:
      POSTGRES_DB: approachability
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  pgdata:
