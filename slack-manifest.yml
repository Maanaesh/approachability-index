display_information:
  name: Approachability
  description: Sets your Slack status to today's vibe, based on your recovery. Only the vibe, never the score.
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: approachability
    always_online: true
  slash_commands:
    - command: /approachability
      url: https://YOUR_PUBLIC_BASE_URL/slack/events
      description: Connect, configure, pause or check your vibe
      usage_hint: "[connect | settings | status | pause | resume | disconnect | help]"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://YOUR_PUBLIC_BASE_URL/slack/oauth_redirect
  scopes:
    user:
      - users.profile:read
      - users.profile:write
    bot:
      - commands
      - chat:write
      - users:read
      - emoji:read
settings:
  event_subscriptions:
    request_url: https://YOUR_PUBLIC_BASE_URL/slack/events
    bot_events:
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://YOUR_PUBLIC_BASE_URL/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
